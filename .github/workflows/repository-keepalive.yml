name: Repository keepalive

on:
  schedule:
    - cron: "41 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 50日無活動ならkeep-aliveコミット
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          last=$(git log -1 --format=%ct)
          days=$(( (now - last) / 86400 ))
          echo "最終コミットから ${days} 日"

          if [ "$days" -lt 50 ]; then
            echo "まだkeep-alive不要"
            exit 0
          fi

          mkdir -p .github
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/.repository-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/.repository-keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push
